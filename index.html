<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Índice Cantos Taizé</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="imagenes/cruz-taize.png">
</head>

<body>

    <!-- Menú de NAVEGACIÓN SUPERIOR -->
    <nav class="site-nav">
        <a href="#inicio" class="nav-link">Inicio</a>
        <a href="#repertorio" class="nav-link">Repertorio</a>
        <a href="#oracion" class="nav-link">La oración de Taizé</a>
        <a href="#ensayo" class="nav-link">Ensayo de cantos</a>
        <!-- <a href="#sobre-nosotros" class="nav-link">Sobre nosotros</a> -->
        <!-- <a href="#contacto" class="nav-link">Contacto</a> -->
    </nav>

    <!-- Sección de INICIO -->
    <div data-include="secciones/Inicio.html"></div> 
    <!-- Sección de REPERTORIO -->
    <div data-include="secciones/Repertorio.html"></div>
    <!-- Sección de ORACIÓN -->
    <div data-include="secciones/Oracion.html"></div>   
    <!-- Sección de ENSAYO -->
    <div data-include="secciones/Ensayo.html"></div>

    <script>
        document.querySelectorAll("[data-include]").forEach(async (el) => {
            const archivo = el.getAttribute("data-include");
            try {
                const respuesta = await fetch(archivo);
                if (respuesta.ok) {
                    const html = await respuesta.text();
                    el.outerHTML = html; // Reemplaza el div por el contenido real del archivo
                } else {
                    el.innerHTML = `<p style="color:red;">No se pudo cargar ${archivo}</p>`;
                }
            } catch (error) {
                console.error("Error al incluir el archivo:", error);
            }
        });
    </script>

</body>

</html>
