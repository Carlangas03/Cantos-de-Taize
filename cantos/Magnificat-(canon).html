<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magnificat (canon)</title>
    <!-- Librerías de ABCJS -->
    <script src="https://cdn.jsdelivr.net/npm/abcjs@6.2.2/dist/abcjs-basic.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/abcjs@6.2.2/dist/abcjs-audio.css">
    <!-- Tus estilos generales -->
    <link rel="stylesheet" href="../style.css">
</head>

<body>
    <div class="container">
        <!-- Enlace para volver -->
        <div style="margin-bottom: 20px;">
            <a href="../index.html">← Volver al Índice</a>
        </div>

        <h1>Magnificat (canon)</h1>

        <!-- Checkboxes de voces -->
        <div style="margin-bottom: 20px;">
            <span style="font-weight: bold; margin-right: 15px;">Voces Activas:</span>
            <label style="margin-right: 15px; cursor: pointer;">
                <input type="checkbox" id="chk-S" checked onchange="actualizarMotor()" style="accent-color: #ff5e00;"> Voz principal
            </label>
            <label id="chk-A"></label>
            <label id="chk-T"></label>
            <label style="margin-right: 15px; cursor: pointer;">
                <input type="checkbox" id="chk-B" checked onchange="actualizarMotor()" style="accent-color: #ff5e00;"> Voz auxiliar
            </label>
            
        </div>

        <!-- Contenedores de la partitura y reproductor -->
        <div id="paper" style="background: white; padding: 15px; border-radius: 8px; box-sizing: border-box;"></div>
        <div id="audio" style="margin-top: 15px;"></div>
    </div>

    <!-- Script con la partitura de esta canción -->
    <script>
        const MI_PARTITURA = `
X:1
T:Magnificat
T:"Mi alma glorifica al Señor"
C:Lucas 1,46-55
T:Nota: Por ahora, no sé cómo conseguir que se reproduzca como un canon
M:C
L:1/4
K:G
Q: 1/4=100
%%score [S B]
V:S clef=treble
[V:S] [[1]] "G" !f! B A/G/ "C" E2 | "D" F E/F/ "G" G2 || [[2]] D D/D/ "C" E/E/ F/G/ | "D" A A  "G" G/A/ B ||
w:Ma-gni-fi-cat, ma-gni-fi-cat, ma-gni-fi-cat a-ni-ma me-a Do-mi-num
%
[[3]]  B  A/G/ "C" E2 | "D7" c B/A/ "G" G2 || [[4]] d c/B/ "C" c/B/ A/G/ | "D" F2 "G" G2 :|]
w:Ma-gni-fi-cat, ma-gni-fi-cat, ma-gni-fi-cat a-ni-ma me-a
V:B clef=treble
[V:B] !p![[1]] G2 G2 | A2 B2 || [[2]] d2 (c B) | A2 B2 ||
w: Ma-gni-fi-cat, ma-gni- _ fi-cat, 
%
[[3]] d d (e/d/) c/B/ | A d B2 || [[4]] B B (c/B/) A/G/ | F/E/ F G2 :|]
w:a-ni-ma _ me-a Do-mi-num, a-ni-ma _ me-a Do- _ mi-num
`;
    </script>

<!-- Motor general externo -->
<script src="../motor.js"></script>
</body>
</html>
