<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Confitemini Domino</title>
    <!-- Importar abcjs desde CDN -->
    <script src="https://cdn.jsdelivr.net/npm/abcjs@6.2.2/dist/abcjs-basic.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/abcjs@6.2.2/dist/abcjs-audio.css">
</head>
<body style="font-family: Arial, sans-serif; padding: 20px; background: #b3daff;">

    
    <div style="background: #f0faff; padding: 15px; border-radius: 8px; margin-bottom: 20px;"><a href="../../index.html" style="color: #ff5e00"><b>Click para volver al Índice</b></a></div>

    <!-- BOTONES DE SELECCIÓN MÚLTIPLE (Checkboxes) -->
    <div style="background: #f0faff; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
        <span style="font-weight: bold; margin-right: 15px;">Voces Activas:</span>
        
        <label style="margin-right: 15px; cursor: pointer;">
            <input type="checkbox" id="chk-S" checked onchange="actualizarMotor()" style="accent-color: #ff5e00;"> Soprano
        </label>
        <label style="margin-right: 15px; cursor: pointer;">
            <input type="checkbox" id="chk-A" checked onchange="actualizarMotor()" style="accent-color: #ff5e00;"> Contralto
        </label>
        <label style="margin-right: 15px; cursor: pointer;">
            <input type="checkbox" id="chk-T" checked onchange="actualizarMotor()" style="accent-color: #ff5e00;"> Tenor
        </label>
        <label style="margin-right: 15px; cursor: pointer;">
            <input type="checkbox" id="chk-B" checked onchange="actualizarMotor()" style="accent-color: #ff5e00;"> Bajo
        </label>
    </div>

    <!-- Contenedores visuales -->
    <div id="paper" style="background: #f0faff; padding: 15px; border-radius: 8px; box-sizing: border-box"></div>
    <div id="audio" style="margin-top: 15px;"></div>

    <script>
        // =====================================================================
        // ZONA DE DATOS (LA PLANTILLA)
        // -> Solo necesitas modificar este bloque de texto para cada canción.
        // =====================================================================
        
        const MI_PARTITURA = `
X:1
T:Confitemini Domino
M:3/4
L:1/4
K:D
Q: 1/4=75        
%%score [S A T B]
V:S name="Soprano" clef=treble
%%midi program 52
[V:S] F/F/ F/F/ F | F/D/ D2 |(F/G/) (G/F/) (F/A/) | E E2 | G/G/ G/G/ G |G/E/ E2 | A/B/ (A/G/F/E/) | F3 |]
V:A name="Contralto" clef=treble
%%midi program 52
[V:A] D/D/ D/D/ D | D/D/ D2 |(D/E/) (E/D/) (D/B,/) | C C2 | E/E/ E/E/ E |E/E/ E2 | B,/B,/ B, C | D3 |]
V:T name="Tenor" clef=bass
%%midi program 52
[V:T] A,/A,/ A,/A,/ A, |B,/F,/ F,2 |(A,/B,/) (B,/A,/) (A,/F,/) | A, A,2 |B,/B,/ B,/B,/ B, | =C/A,/ A,2 | E,/E,/ (E, A,) | A,3 |]
V:B name ="Bajo" clef=bass
%%midi program 52
[V:B] D,/D,/ D,/D,/ D, | B,,/B,,/ B,,2 | D, D, D, | A,, A,,2 | E,/E,/ E,/E,/ E, | =C,/C,/ C,2 | E,/E,/ (E,A,,) | D,3 |]
`;

        // =====================================================================
        // ZONA DE LÓGICA (EL MOTOR)
        // -> No hace falta que toques esto nunca más.
        // =====================================================================

        function actualizarMotor() {
            // 1. Ver qué voces están activas
            const activas = {
                S: document.getElementById('chk-S').checked,
                A: document.getElementById('chk-A').checked,
                T: document.getElementById('chk-T').checked,
                B: document.getElementById('chk-B').checked
            };

            let lineas = MI_PARTITURA.trim().split('\n');
            let partituraProcesada = [];
            let vozActual = ""; // Memoria de la última voz detectada

            // 2. Procesar línea a línea rastreando el contexto
            for (let linea of lineas) {
                let lineaLimpia = linea.trim();

                // Si la línea define cabecera de voz (ej: V:S name=...)
                if (lineaLimpia.startsWith("V:")) {
                    vozActual = lineaLimpia.charAt(2); // Extrae S, A, T o B
                }

                // Si la línea comienza explícitamente con [V:X], actualizamos la voz actual
                if (lineaLimpia.startsWith("[V:")) {
                    vozActual = lineaLimpia.charAt(3);
                }

                // Si estamos dentro de una voz y esa voz está desactivada por el usuario
                if (vozActual && activas[vozActual] === false) {
                    // Si la línea contiene notas (es decir, no es una cabecera de sistema)
                    if (lineaLimpia.includes("[V:") || (!lineaLimpia.startsWith("X:") && !lineaLimpia.startsWith("T:") && !lineaLimpia.startsWith("M:") && !lineaLimpia.startsWith("L:") && !lineaLimpia.startsWith("K:") && !lineaLimpia.startsWith("%%score") && !lineaLimpia.startsWith("V:"))) {
                        
                        // Si la línea tiene la etiqueta [V:X], la conservamos y muteamos el resto
                        if (lineaLimpia.startsWith("[V:")) {
                            let etiquetaVoz = linea.substring(0, linea.indexOf("]") + 1);
                            linea = etiquetaVoz + " z || z4 | z4 |z4 | z4 |"; 
                        } else {
                            // Es una línea de continuación (sin [V:X] pero de la misma voz), la convertimos entera en silencios
                            linea = " z4 | z4 | z4 |z4 |]";
                        }
                    }
                }

                partituraProcesada.push(linea);
            }

            const abcFinal = partituraProcesada.join('\n');

            // 3. Renderizar y cargar audio
            document.getElementById("paper").innerHTML = "";
            document.getElementById("audio").innerHTML = "";

            const visualObj = ABCJS.renderAbc("paper", abcFinal, {
                responsive: "resize",
                scale: 0.8,
                add_classes: true
            });

            if (ABCJS.synth.supportsAudio()) {
                const synthControl = new ABCJS.synth.SynthController();
                synthControl.load("#audio", null, {
                    displayPlay: true, displayLoop: true, displayRestart: true, displayProgress: true
                });

                const createSynth = new ABCJS.synth.CreateSynth();
                createSynth.init({
                    visualObj: visualObj[0]
                }).then(() => {
                    synthControl.setTune(visualObj[0], false);
                });
            }
        }

        // Arrancar el motor al abrir la página
        window.onload = actualizarMotor;
        
    </script>
</body>
</html>
