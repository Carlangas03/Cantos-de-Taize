<!DOCTYPE html>

<head>

    <title>Laudate Dominum</title>
    <!-- Librerías de ABCJS -->

        <h1>Laudate Dominum</h1>

        <!-- Checkboxes de voces -->
        <span class="letrero-voces-transporte">Voces Activas</span>
        <div class="voces-container">
            <label><input type="checkbox" id="chk-S" checked onchange="actualizarMotor()"> Soprano</label>
            <label><input type="checkbox" id="chk-A" checked onchange="actualizarMotor()"> Contralto</label>
            <label><input type="checkbox" id="chk-T" checked onchange="actualizarMotor()"> Tenor</label>
            <label><input type="checkbox" id="chk-B" checked onchange="actualizarMotor()"> Bajo</label>
        </div>

        <!-- Contenedores de la partitura y reproductor -->
        <div id="paper" style="background: white; padding: 15px; border-radius: 8px; box-sizing: border-box;"></div>
        <div id="audio" style="margin-top: 15px;"></div>
    </div>

    <div class="container">
        <h1>Notas</h1>
        <p class="letrero-voces-transporte">Traducción</p>
        <p class="subparrafo">Alabad al Señor todas las naciones. Aleluya (Salmo 117).</p>
