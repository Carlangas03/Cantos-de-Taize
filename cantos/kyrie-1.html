<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Kyrie eleison 1</title>
    <!-- Importar abcjs desde CDN -->
    <script src="https://cdn.jsdelivr.net/npm/abcjs@6.2.2/dist/abcjs-basic.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/abcjs@6.2.2/dist/abcjs-audio.css">
    <link rel="stylesheet" href="../style.css">
    <link rel="icon" type="image/png" href="../imagenes/cruz-taize.png">

</head>
<body style="font-family: Arial, sans-serif; padding: 20px; background: #b3daff;">

    
    <div class="container">
        <!-- Enlace para volver -->
        <div>
            <a href="../index.html#repertorio">← Volver al Índice</a>
        </div>

        <h1>Kyrie 1</h1>

        <!-- Checkboxes de voces -->
        <span class="letrero-voces-transporte">Voces Activas</span>
        <div class="voces-container">
            <label><input type="checkbox" id="chk-S" checked onchange="actualizarMotor()"> Soprano</label>
            <label><input type="checkbox" id="chk-A" checked onchange="actualizarMotor()"> Contralto</label>
            <label><input type="checkbox" id="chk-T" checked onchange="actualizarMotor()"> Tenor</label>
            <label><input type="checkbox" id="chk-B" checked onchange="actualizarMotor()"> Bajo</label>
        </div>

        <!-- Contenedores de la partitura y reproductor -->
        <div id="paper" style="background: white; padding: 15px; border-radius: 8px; box-sizing: border-box;"></div>
        <div id="audio" style="margin-top: 15px;"></div>
    </div>

    <div class="container">
        <h1>Notas</h1>
        <p class="letrero-voces-transporte">Traducción</p>
        <p class="subparrafo">Señor, ten piedad.</p>
        <p class="letrero-voces-transporte">Modificación de la partitura</p>
        <p class="subparrafo">La sílaba -son (de elei<b>son</b>) dura dos tiempos, en lugar de uno (según la partitura original) para que el tempo sea constantemente 2/4.</p>

    </div>


    <script>
        // =====================================================================
        // ZONA DE DATOS (LA PLANTILLA)
        // -> Solo necesitas modificar este bloque de texto para cada canción.
        // =====================================================================
        
        const MI_PARTITURA = `
X:1
T:Kyrie 1
M:2/4
L:1/4
K:G
Q: 1/4=90        
%%score [S A T B]
V:S name="S" clef=treble
[V:S] "G" B/c/ "D" d | "Em" G/A/ "Bm" B | "C" E/ G "D"  F/ | "G" G2 | B/c/ "D" d | "Em" G/A/ "Bm" B | "C" E/ G "C" F/ | "G" G2 |]
w: Ky-ri-e Ky-ri-e e-le-i-son. Ky-ri-e Ky-ri-e e-le-i-son
V:A name="C" clef=treble
G/G/ F | E/E/ F | E/ E D/ | D2 | G/G/ F | E/E/ F | E/ E D/ | D2 |]
w: Ky-ri-e Ky-ri-e e-le-i-son. Ky-ri-e Ky-ri-e e-le-i-son
[V:A] 
V:T name="T" clef=bass
D/E/ D | B,/C/ D | C/ B, A,/ | B,2 | D/E/ D | B,/C/ D | C/ B, A,/ | B,2 |]
w: Ky-ri-e Ky-ri-e e-le-i-son. Ky-ri-e Ky-ri-e e-le-i-son
[V:T] 
V:B name="B" clef=bass
[V:B] 
G,/G,/ D, | E,/E,/ B,, | C,/ C, D,/ | G,,2 | G,/G,/ D, | E,/E,/ B,, | C,/ C, D,/ | G,,2 |]
w: Ky-ri-e Ky-ri-e e-le-i-son. Ky-ri-e Ky-ri-e e-le-i-son
`;
</script>
<script src="../motor.js"></script>
</body>
</html>
